# Claude Code on issues and pull requests.
#
# Mentioning @claude in an issue, an issue comment, a pull request review or a
# review comment starts a run. Only Gabriel can trigger it: every job checks
# that the actor is the repository owner, so a comment from anyone else is
# ignored.
#
# Permissions are contents / pull-requests / issues write and nothing more.
# No administration, no release rights: this workflow cannot change the
# repository's visibility, create a release, or push a tag.
#
# Requires the Claude GitHub App installed on this repository, and the
# CLAUDE_CODE_OAUTH_TOKEN secret set from `claude setup-token`. Runs draw on
# Gabriel's Claude subscription.
#
# This was briefly wired to an Anthropic API key instead. That needs prepaid
# API credits, which the account does not carry and which are billed
# separately from the subscription, so the key authenticated and then failed
# with "credit balance is too low". To go back to API billing, buy credits,
# then swap the two references below to `anthropic_api_key` and
# `ANTHROPIC_API_KEY`.
#
# The repository is public, so note what that does and does not expose:
# secrets are never given to a workflow run from a forked pull request, and
# fork runs additionally need an owner's approval. The token is reachable
# only from branches in this repository.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    name: claude
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: The auth token must be set
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo 'CLAUDE_CODE_OAUTH_TOKEN is not set on this repository.'
            echo 'Generate one with `claude setup-token`, then add it under'
            echo 'Settings -> Secrets and variables -> Actions.'
            echo 'Set it through the web UI, or type the value at an'
            echo 'interactive prompt: `gh secret set` reads stdin, so running'
            echo 'it without a terminal silently stores an empty value.'
            exit 1
          fi
          echo 'CLAUDE_CODE_OAUTH_TOKEN is set'

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt:` here on purpose. Passing one REPLACES the action's
          # default issue/pull-request handling, so Claude would run that
          # prompt instead of answering the thing it was tagged on — it
          # returns after a single turn having posted nothing.
          #
          # The house rules live in /CLAUDE.md, which Claude Code reads
          # automatically as project context, here and in local sessions.
          #
          # Tool grant. Without --allowedTools the agent cannot run anything:
          # a wiring test on 2026-09-27 could read `lean-toolchain` but not
          # execute `checks/repo_guardrails.py`. Every workstream task needs
          # to run something, so the local toolset is granted.
          #
          # What contains this, given the repository is public:
          #   - the job runs on an ephemeral GitHub-hosted runner, never on
          #     the self-hosted machine (see "Where the heavy work happens"
          #     below);
          #   - only the repository owner can trigger a run at all;
          #   - the job token is contents / pull-requests / issues write,
          #     with no administration and no release rights;
          #   - `main` is protected, so nothing here can merge;
          #   - the `v*` ruleset is admin-only, so nothing here can tag or
          #     release even holding contents: write.
          # The worst case is a bad branch and a pull request Gabriel then
          # declines.
          #
          # Web tools are deliberately NOT granted. Fetched pages are
          # untrusted input, and nothing in the current tasks needs them. Add
          # them deliberately if a task genuinely does.
          #
          # --disallowedTools restates the hard rules at the tool layer. The
          # ruleset and token scope already block these; this makes the
          # attempt fail immediately and legibly instead of burning a run.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite"
            --disallowedTools "Bash(gh release:*),Bash(gh repo edit:*),Bash(gh repo delete:*),Bash(git tag:*),Bash(git push --force:*),Bash(git push -f:*)"
