# Lean build. Required status check on main: "lean-build".
#
# Runs on Gabriel's self-hosted runner: Linux inside WSL2, on a 32 GB Windows
# host. It serves only this repository. The distro needs elan, git, git-lfs,
# gcc and python3; see .github/RUNNER.md.
name: lean-build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean-build:
    name: lean-build
    runs-on: [self-hosted, linux, 32gb]
    timeout-minutes: 360

    env:
      # Peak memory must stay under 32 GB. Some modules of the corun1024 port
      # peak around 20 GB on their own, so parallelism is capped rather than
      # left to the core count. JOBS is what `lake -j` and the corun1024
      # build.sh both take; MEMORY is the per-process soft cap in MB that the
      # corun1024 build reads.
      JOBS: '2'
      MEMORY: '12000'
      # Lean's own thread pool, kept in step with JOBS.
      LEAN_NUM_THREADS: '2'

    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/ is not needed to build lean/; tasks that need it
          # check it out themselves.
          submodules: false
          lfs: false

      - name: Runner has what it needs
        run: |
          set -euo pipefail
          for tool in git git-lfs gcc python3 elan lake; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done
          echo "toolchain pin: $(cat lean-toolchain)"
          echo "kernel: $(cat /proc/version)"
          free -g

          # Under WSL2 this is the distro's configured share, not the host's
          # 32 GB. WSL2 defaults to about half the host, which is under the
          # ~20 GB a single corun1024 module can take, so .wslconfig has to
          # raise it. See .github/RUNNER.md.
          total_gb=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          echo "memory visible to this runner: ${total_gb} GB"
          if [ "$total_gb" -lt 24 ]; then
            echo "too little memory for this build."
            if grep -qi microsoft /proc/version; then
              echo "this is WSL2: raise memory= in %UserProfile%\\.wslconfig,"
              echo "then 'wsl --shutdown' and start it again."
            fi
            exit 1
          fi

          # The runner must live in the distro's own filesystem. Working
          # under /mnt/c crosses the 9p boundary on every file, which is
          # slow enough to matter for a Mathlib tree.
          case "$GITHUB_WORKSPACE" in
            /mnt/*)
              echo "workspace is on the Windows filesystem: $GITHUB_WORKSPACE"
              echo "re-register the runner under the distro's home directory."
              exit 1
              ;;
          esac

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"
          elan override set "$(cat lean-toolchain)"
          lean --version

      - name: Restore the Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build lean/
        run: |
          set -euo pipefail
          /usr/bin/time -v lake build -j "$JOBS" 2>&1 | tail -40

      - name: Peak memory
        if: always()
        run: free -g
