# Build one of the two Lean ports on the self-hosted runner, and collect the
# evidence task A1 needs: wall time, peak memory, whether it builds clean, and
# `#print axioms` on the final theorem.
#
# Manual trigger only. This is a multi-hour job on Gabriel's machine and must
# never start by itself.
#
# It builds each port on its OWN pinned toolchain, not ours. Moving the chosen
# port to v4.34.1 is task A2; mixing the two would confound the measurement.
# `checks/repo_guardrails.py` is not run here for the same reason — this
# workflow deliberately steps outside the pin.
#
# Nothing is committed. Results land as a run artifact for a human to read and
# paste into notes/A-rosetta-stone.md.
name: port-build

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Which port to build'
        required: true
        type: choice
        options:
          - corun1024
          - RBarish-UTokyo
      jobs:
        description: 'Parallel build jobs. corun schedules against the memory budget, so 4 is fine; most modules run under 2 GB.'
        required: true
        default: '4'
        type: string
      memory_gb:
        description: 'Memory budget in GB for corun build_pool.py (NOT MB). Ignored for RBarish.'
        required: true
        default: '20'
        type: string
      fresh:
        description: 'Discard any previous checkout and start over. Leave off to resume an interrupted build.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: port-build
    runs-on: [self-hosted, linux, 32gb]
    # A first corun1024 run reported "plan: 821 modules, 7.9 core-hours,
    # 1 jobs, 20 GB budget, predicted 474 min" — over the old 360 cap, so the
    # build would have been killed about three quarters through. Headroom
    # matters more than a tight cap here: the run is manual, the resume makes
    # a second attempt cheap, and a build cut off at 99% teaches us nothing.
    timeout-minutes: 720
    if: github.actor == github.repository_owner

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Where we are, and what we have
        run: |
          set -euo pipefail
          echo "port:       ${{ inputs.port }}"
          echo "jobs:       ${{ inputs.jobs }}"
          echo "memory_gb:  ${{ inputs.memory_gb }} GB"
          echo "kernel:     $(cat /proc/version)"
          free -g
          df -h .
          case "$HOME" in
            /mnt/*) echo "runner home is on the Windows filesystem; too slow to measure"; exit 1 ;;
          esac

          # Fail here rather than five minutes into the build. corun's
          # scripts/bulkspace.py imports numpy, and a 2026-09-27 run got all the
          # way to certificate generation before dying on it.
          missing=""
          for tool in git elan lake python3; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          python3 -c 'import numpy' 2>/dev/null || missing="$missing python3-numpy"
          if [ -n "$missing" ]; then
            echo "missing on this runner:$missing"
            echo
            echo "Install inside the WSL2 distro, as the runner's user:"
            echo "  sudo apt-get update && sudo apt-get install -y python3-numpy"
            exit 1
          fi
          echo "dependencies present, numpy $(python3 -c 'import numpy; print(numpy.__version__)')"

          # Disk. On 2026-09-27 the distro filled to 100% after the corun
          # build, and the symptom was not a helpful error: Runner.Listener
          # crashed at startup because it could not write its own log, the
          # runner went offline to GitHub, and an unrelated lean-build died
          # mid-step with no message. A long build should not start without
          # room to finish.
          #
          # 15 GB, from measurement rather than from a README. Both ports
          # come to 8.0 GB built, plus about 3 GB for a toolchain that is not
          # yet installed. The first version of this check demanded 30 GB,
          # taken from RBarish's "about 25 GB" claim, and promptly blocked a
          # build that needed 8 GB and had 20 free.
          avail_gb=$(df -BG --output=avail "$HOME" | tail -1 | tr -dc '0-9')
          echo "disk available to the runner: ${avail_gb} GB"
          df -h "$HOME"
          if [ "${avail_gb:-0}" -lt 15 ]; then
            echo
            echo "under 15 GB free; this build would probably fill the disk."
            echo "Free space, or grow the distro:"
            echo "  rm -rf \$HOME/4ct-port-cache/<port you no longer need>"
            echo "  elan toolchain uninstall <a toolchain no longer needed>"
            echo "  wsl --manage Ubuntu --resize 60GB   # from Windows, distro stopped"
            exit 1
          fi

      # PORT_DIR deliberately sits OUTSIDE $GITHUB_WORKSPACE. actions/checkout
      # cleans the workspace at the start of every job, which silently deleted
      # the previous checkout and made the resume a no-op: the 2026-09-27 run
      # regenerated the reducibility certificates from scratch even with
      # `fresh` off, because there was nothing left to reuse.
      - name: Check out the port at its pinned commit
        run: |
          set -euo pipefail
          # Both absolute. PORT_DIR is outside the workspace so checkout
          # cannot wipe it; OUT_DIR must nonetheless stay INSIDE the
          # workspace, because actions/upload-artifact resolves its path
          # relative to the workspace. Relative "../out" paths were correct
          # only while the build ran from inside the workspace, and moving
          # PORT_DIR silently redirected every result file to
          # $HOME/4ct-port-cache/out where the upload could not see them.
          echo "PORT_DIR=$HOME/4ct-port-cache/${{ inputs.port }}" >> "$GITHUB_ENV"
          echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"
          PORT_DIR="$HOME/4ct-port-cache/${{ inputs.port }}"
          mkdir -p "$(dirname "$PORT_DIR")"
          case "${{ inputs.port }}" in
            corun1024)
              URL=https://github.com/corun1024/4ct.git
              SHA=3db71e0a786a1f19be04c5266fe3d06fed216885
              ;;
            RBarish-UTokyo)
              URL=https://github.com/RBarish-UTokyo/FourColorTheorem-Lean4.git
              SHA=20fa34599f5189dd569d96dd22f306c94ab1c446
              ;;
            *) echo "unknown port"; exit 1 ;;
          esac
          if [ "${{ inputs.fresh }}" = "true" ]; then
            echo "fresh requested; discarding any previous checkout"
            rm -rf "$PORT_DIR"
          fi

          # Resume where possible. A full run regenerates the reducibility
          # certificates (about a core-hour) and rebuilds every olean, so an
          # interrupted build should not start from nothing. Lake is
          # incremental; keeping .lake and the generated certificates is the
          # whole saving.
          if [ -d "$PORT_DIR/.git" ] && [ "$(git -C "$PORT_DIR" rev-parse HEAD 2>/dev/null)" = "$SHA" ]; then
            echo "RESUME: reusing the existing checkout at $SHA in $PORT_DIR"
            du -sh "$PORT_DIR" 2>/dev/null || true
          else
            echo "FRESH: cloning $URL at $SHA into $PORT_DIR"
            rm -rf "$PORT_DIR" && mkdir -p "$PORT_DIR" && cd "$PORT_DIR"
            git init -q .
            git remote add origin "$URL"
            git fetch -q --depth 1 origin "$SHA"
            git checkout -q FETCH_HEAD
          fi
          echo "port toolchain: $(cat "$PORT_DIR/lean-toolchain")"

      - name: Install that port's own toolchain
        working-directory: ${{ env.PORT_DIR }}
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"
          elan override set "$(cat lean-toolchain)"
          lean --version

      - name: Mathlib cache
        working-directory: ${{ env.PORT_DIR }}
        run: |
          set -euo pipefail
          lake exe cache get || echo "cache get failed; the build will compile Mathlib itself"

      - name: Build, measured
        id: build
        working-directory: ${{ env.PORT_DIR }}
        env:
          JOBS: ${{ inputs.jobs }}
          MEMORY: ${{ inputs.memory_gb }}
          LEAN_NUM_THREADS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # Sample peak memory alongside the build: /usr/bin/time -v reports the
          # largest single process, which understates a pool of parallel jobs.
          ( while true; do
              awk '/MemAvailable/ {print systime(), $2}' /proc/meminfo >> "$OUT_DIR/mem-samples.txt"
              sleep 5
            done ) &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT

          start=$(date +%s)
          set +e
          # EXTRA_TARGET matters. RBarish keeps its final theorem in
          # Solution.lean, a separate root: a bare `lake build` builds the
          # FourColor library, exits 0, and never produces Solution.olean, so
          # the axiom check has nothing to import while the build looks
          # entirely successful.
          case "${{ inputs.port }}" in
            RBarish-UTokyo) EXTRA_TARGET=Solution ;;
            *)              EXTRA_TARGET="" ;;
          esac

          if [ -x ./build.sh ]; then
            echo "using the port's own build.sh (JOBS=$JOBS MEMORY=$MEMORY GB)"
            /usr/bin/time -v ./build.sh > "$OUT_DIR/build.log" 2>&1
          else
            echo "no build.sh; using lake build ${EXTRA_TARGET}"
            /usr/bin/time -v lake build $EXTRA_TARGET > "$OUT_DIR/build.log" 2>&1
          fi
          status=$?
          set -e
          end=$(date +%s)

          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          echo "wall_seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "build exited $status after $((end - start))s"
          tail -60 "$OUT_DIR/build.log"

      - name: Peak memory actually observed
        if: always()
        run: |
          set -euo pipefail
          total_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          min_avail=$(awk '{print $2}' "$OUT_DIR/mem-samples.txt" 2>/dev/null | sort -n | head -1)
          if [ -n "${min_avail:-}" ]; then
            peak_gb=$(awk -v t="$total_kb" -v a="$min_avail" 'BEGIN {printf "%.1f", (t-a)/1024/1024}')
            echo "peak memory in use during the build: ${peak_gb} GB" | tee "$OUT_DIR/peak-memory.txt"
          else
            echo "no samples collected" | tee "$OUT_DIR/peak-memory.txt"
          fi

      - name: Axioms of the final theorem
        id: axioms
        if: always()
        working-directory: ${{ env.PORT_DIR }}
        run: |
          set -euo pipefail
          case "${{ inputs.port }}" in
            corun1024)
              IMPORT="import FourColor.Complete"
              NAME="FourColor.fourColorTheorem"
              ;;
            RBarish-UTokyo)
              IMPORT="import Solution"
              NAME="FourColor.RealPlane.four_color"
              ;;
          esac
          printf '%s\n#print axioms %s\n' "$IMPORT" "$NAME" > Axioms.lean
          echo "--- Axioms.lean ---"; cat Axioms.lean
          if lake env lean Axioms.lean 2>&1 | tee "$OUT_DIR/axioms.txt"; then
            echo "axioms_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "axioms_ok=false" >> "$GITHUB_OUTPUT"
            echo "axiom check FAILED - the final theorem was not produced" | tee -a "$OUT_DIR/axioms.txt"
          fi

      - name: The port's own checks
        if: always()
        working-directory: ${{ env.PORT_DIR }}
        run: |
          set -euo pipefail
          {
            case "${{ inputs.port }}" in
              corun1024)
                [ -x scripts/check.sh ] && bash scripts/check.sh || echo "scripts/check.sh: absent or failed"
                ;;
              RBarish-UTokyo)
                [ -f scripts/check_challenge_sync.py ] && python3 scripts/check_challenge_sync.py \
                  || echo "check_challenge_sync.py: absent or failed"
                ;;
            esac
          } 2>&1 | tee "$OUT_DIR/upstream-checks.txt" || true

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## port-build: ${{ inputs.port }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | pinned, see the checkout step |"
            echo "| toolchain | \`$(cat "${PORT_DIR:-}/lean-toolchain" 2>/dev/null || echo unknown)\` |"
            echo "| JOBS | ${{ inputs.jobs }} |"
            echo "| memory budget | ${{ inputs.memory_gb }} GB |"
            echo "| build exit status | ${{ steps.build.outputs.exit_status }} |"
            echo "| wall clock | ${{ steps.build.outputs.wall_seconds }} s |"
            echo "| $(cat "$OUT_DIR/peak-memory.txt" 2>/dev/null || echo 'peak memory | unknown') |"
            echo
            echo '### Axioms'
            echo '```'
            cat "$OUT_DIR/axioms.txt" 2>/dev/null || echo "(none captured)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Cancelling this workflow does NOT reliably stop the build. On
      # 2026-09-27 GitHub marked a run cancelled and build_pool.py exited,
      # but left four lean processes orphaned and still compiling, ~13 GB
      # between them, for a job that no longer existed. They are identifiable
      # by the port checkout in their -R argument, so nothing else is touched.
      - name: Sweep any orphaned build processes
        if: always()
        run: |
          set -uo pipefail
          # Every grep here can legitimately match nothing, and the step runs
          # under `bash -e` with pipefail, so an unguarded pipeline that finds
          # no orphans kills the step. That is what marked an entirely
          # successful 2-hour build as failed on 2026-09-27.
          pids=$(ps -eo pid,args | grep '[l]ean ' | grep -F "$PORT_DIR" | awk '{print $1}' || true)
          # Scope build_pool.py by working directory, not by name: it is
          # started by a relative path, so a bare pgrep would also kill any
          # other build on the machine, including lean-build's.
          pool=""
          for p in $(pgrep -f 'scripts/build_pool\.py' || true); do
            [ "$(readlink "/proc/$p/cwd" 2>/dev/null)" = "$PORT_DIR" ] && pool="$pool $p"
          done
          pool=${pool# }
          if [ -n "${pool}${pids}" ]; then
            echo "killing leftovers: pool=${pool:-none} lean=${pids:-none}"
            [ -n "$pool" ] && kill -KILL $pool 2>/dev/null
            [ -n "$pids" ] && kill -KILL $pids 2>/dev/null
            sleep 2
          fi
          left=$(ps -eo pid,args | grep -c "[l]ean .*$PORT_DIR" || true)
          echo "lean processes still in the port checkout: $left"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-build-${{ inputs.port }}
          path: out/
          retention-days: 30

      # Both conditions. Checking only the build's exit code produced a green
      # run on 2026-09-27 whose axiom check had in fact failed: lake build
      # succeeded at a target that did not include the theorem. A green run
      # that proves nothing is worse than a red one.
      - name: Fail the run unless the build AND the axiom check passed
        if: always()
        run: |
          set -uo pipefail
          ok=0
          if [ "${{ steps.build.outputs.exit_status }}" != "0" ]; then
            echo "build exited ${{ steps.build.outputs.exit_status }}"; ok=1
          fi
          if [ "${{ steps.axioms.outputs.axioms_ok }}" != "true" ]; then
            echo "axiom check did not pass (axioms_ok=${{ steps.axioms.outputs.axioms_ok }})"; ok=1
          fi
          if [ "$ok" -eq 0 ]; then echo "build and axiom check both passed"; fi
          exit $ok
