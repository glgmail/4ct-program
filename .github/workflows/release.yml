# Release. Manual trigger only, and gated twice.
#
#   1. `workflow_dispatch` only. There is no push, tag or schedule trigger,
#      so nothing here can start by itself.
#   2. The job runs in the `public-release` environment, which has Gabriel as
#      a required reviewer. The run pauses until he approves it.
#
# This workflow must never change the repository's visibility. It holds no
# `administration` permission, so it cannot; a guard step below also fails the
# run if the repository has stopped being private.
#
# Release rules (plan of record):
#   - Nothing leaves this repository except as a tagged release approved by
#     Gabriel.
#   - A claimed tier 3 or tier 4 proof must be formalized in Lean before
#     release approval or referee contact.
#   - Agent credentials have no release rights. Tags matching v* are
#     protected so only Gabriel can create them.
#
# Publishing outside GitHub (Zenodo, a DOI, arXiv) is not automated and is
# not done by any agent. Gabriel does it by hand from the artifact this
# workflow produces.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, e.g. v0.1.0 (Gabriel creates the tag by hand)'
        required: true
        type: string
      confirm:
        description: 'Type RELEASE to confirm'
        required: true
        type: string

permissions: {}

jobs:
  package:
    name: package
    # Required reviewer: Gabriel. Configured on the environment, not here.
    environment: public-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Belt and braces: only the repository owner can start this, whatever the
    # environment says.
    if: github.actor == github.repository_owner

    permissions:
      contents: read

    steps:
      - name: Confirm
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo 'confirm input must be exactly RELEASE'
            exit 1
          fi

      - name: The repository must still be private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          echo "private: $private"
          if [ "$private" != "true" ]; then
            echo 'the repository is not private; stopping'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Guardrails must pass at this tag
        run: python3 checks/repo_guardrails.py

      - name: Build the archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="4ct-program-${{ inputs.tag }}/" \
            -o "dist/4ct-program-${{ inputs.tag }}.tar.gz" \
            "${{ inputs.tag }}"
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag }}
          path: dist/
          retention-days: 30

      - name: What happens next
        run: |
          cat <<'EOF'
          The archive is attached to this run as an artifact.

          This workflow does not create a GitHub release, does not push a tag,
          and does not change the repository's visibility. Gabriel takes the
          artifact from here by hand.
          EOF
