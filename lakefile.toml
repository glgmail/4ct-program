# Lake package for the Rosetta Stone library.
#
# Toolchain policy (plan of record): Lean and Mathlib are pinned to v4.34.1 and
# re-pinned only at a gate review, never to a release candidate. The pin is
# enforced by checks/repo_guardrails.py, which runs as the `checks` status check.

name = "FourCT"
version = "0.1.0"
defaultTargets = ["FourCT"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "FourCT"
srcDir = "lean"
# lean/Statements/ is wired in by task A4, which adds `"Statements.+"` here
# together with the first statement files. Statement files need Gabriel's
# sign-off, so none are added by the repository setup.
globs = ["FourCT", "FourCT.+"]
